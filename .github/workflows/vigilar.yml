
name: Vigilar espectaculos de Madrid

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avisos-espectaculos-madrid
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar componentes
        run: pip install -r requirements.txt

      - name: Buscar novedades y enviar avisos
        env:
          GMX_EMAIL: ${{ secrets.GMX_EMAIL }}
          GMX_PASSWORD: ${{ secrets.GMX_PASSWORD }}
          DESTINATARIO_EMAIL: ${{ secrets.DESTINATARIO_EMAIL }}
        run: python monitor.py

      - name: Guardar historial actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usados.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de espectaculos"
            git push
          else
            echo "No hay cambios en el historial."
          fi
